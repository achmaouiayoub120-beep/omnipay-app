# Stack locale OmniPay :  cp .env.example .env && docker compose up -d --build
name: omnipay

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnipay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnipay_db}
      POSTGRES_USER: ${POSTGRES_USER:-omnipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env (voir .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnipay-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: omnipay/auth-service:local
    container_name: omnipay-auth
    environment:
      SERVER_PORT: "8081"
      OMNIPAY_JWT_SECRET: ${OMNIPAY_JWT_SECRET:?Definir OMNIPAY_JWT_SECRET dans .env (voir .env.example)}
    ports:
      - "8081:8081"
    networks:
      - omnipay-network

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction/Dockerfile
    image: omnipay/transaction-service:local
    container_name: omnipay-transaction
    environment:
      SERVER_PORT: "8082"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-omnipay_db}
      DB_USER: ${POSTGRES_USER:-omnipay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env (voir .env.example)}
      OMNIPAY_JWT_SECRET: ${OMNIPAY_JWT_SECRET:?Definir OMNIPAY_JWT_SECRET dans .env (voir .env.example)}
      OMNIPAY_CHAOS_ENABLED: ${OMNIPAY_CHAOS_ENABLED:-false}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnipay-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    image: omnipay/notification-service:local
    container_name: omnipay-notification
    environment:
      SERVER_PORT: "8083"
    ports:
      - "8083:8083"
    networks:
      - omnipay-network

  # Portail web (Nginx non-root) : http://localhost:8080 ; reverse-proxy /api/auth -> auth, /api/transactions -> transaction
  frontend:
    build:
      context: services/frontend
    image: omnipay/frontend-service:local
    container_name: omnipay-frontend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      - omnipay-network

networks:
  omnipay-network:
    driver: bridge

volumes:
  postgres-data:
