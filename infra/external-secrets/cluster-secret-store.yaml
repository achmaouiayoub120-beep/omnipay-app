# ClusterSecretStore : relie External Secrets Operator a Vault.
#   kubectl apply -f infra/external-secrets/cluster-secret-store.yaml
#
# ESO s'authentifie aupres de Vault avec le ServiceAccount ci-dessous (methode Kubernetes,
# role "omnipay-role" cree par init-vault.sh). Les pods applicatifs ne contactent JAMAIS
# Vault : seul ESO lit les secrets, puis les ecrit en Secrets Kubernetes natifs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: omnipay
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: omnipay
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "omnipay-role"
          serviceAccountRef:
            name: eso-vault-auth
            namespace: external-secrets
