# ExternalSecrets applicatifs : Vault -> Secrets Kubernetes natifs, dans chaque namespace.
#   kubectl apply -f infra/external-secrets/external-secrets-omnipay.yaml
#
#   secret/omnipay/database -> Secret omnipay-postgres-credentials
#                              (SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
#   secret/omnipay/jwt      -> Secret omnipay-jwt-secret (JWT_SECRET)
#
# refreshInterval 1h : un secret modifie dans Vault est repris sans intervention. Pour une
# resynchronisation immediate : kubectl annotate externalsecret <nom> -n <ns> \
#   force-sync=$(date +%s) --overwrite
# Un pod qui monte le Secret en VOLUME voit la nouvelle valeur ; une variable d'environnement
# n'est lue qu'au demarrage du conteneur (rolling restart necessaire).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnipay-db-secret
  namespace: omnipay-dev
  labels:
    app.kubernetes.io/part-of: omnipay
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: omnipay-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: omnipay/database
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: omnipay/database
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnipay-jwt-secret
  namespace: omnipay-dev
  labels:
    app.kubernetes.io/part-of: omnipay
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: omnipay-jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: omnipay/jwt
        property: secret
