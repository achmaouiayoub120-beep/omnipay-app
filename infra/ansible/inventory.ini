# Inventaire Ansible - OmniPay Zero-Trust (K3s)
# Aucun secret ici : l'authentification SSH passe par l'agent / les cles de l'operateur.

[k3s_master]
# Execution locale (la VM/machine qui execute Ansible heberge K3s)
localhost ansible_connection=local
# Execution distante via SSH : commenter la ligne ci-dessus et decommenter celle-ci
# k3s-master ansible_host=192.168.56.10 ansible_user=ubuntu

[k3s_agents]
# Noeuds agents optionnels (vide en S1 : cluster single-node)
# k3s-agent-1 ansible_host=192.168.56.11 ansible_user=ubuntu

[k3s:children]
k3s_master
k3s_agents

[k3s:vars]
ansible_python_interpreter=/usr/bin/python3
