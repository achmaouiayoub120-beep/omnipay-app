{{- if .Values.frontend.enabled }}
{{- $ctx := dict "root" $ "name" "frontend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnipay.fullname" $ctx }}
  labels:
    {{- include "omnipay.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "omnipay.selectorLabels" $ctx | nindent 4 }}
{{- end }}
