{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnipay.fullname" $ctx }}
  labels:
    {{- include "omnipay.labels" $ctx | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "omnipay.selectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
