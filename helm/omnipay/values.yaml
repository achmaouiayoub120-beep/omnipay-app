# Valeurs par defaut du chart OmniPay (profil minimal). Chaque cle de `services`
# genere un Deployment et un Service (voir templates/).
# Les profils d'environnement surchargent ce fichier :
#   helm install omnipay helm/omnipay -f helm/omnipay/values-dev.yaml

imagePullSecrets: []

# --- Parametres communs aux 3 services (surchargeables par service dans `services.<nom>`) ---
replicaCount: 1

# Niveau de logs applicatif (package com.omnipay.*)
logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Sondes Kubernetes alimentees par Spring Boot Actuator (management.endpoint.health.probes.enabled)
probes:
  startup:   # laisse jusqu'a 300 s au demarrage (JVM + Flyway, ~110 s mesures a 0,2 CPU) avant que la liveness ne s'applique
    path: /actuator/health/liveness
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Arret gracieux : preStop (retrait des endpoints) + spring.lifecycle.timeout-per-shutdown-phase (20s)
# doivent tenir dans terminationGracePeriodSeconds.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 40

# --- Haute disponibilite (actives dans values-prod.yaml) ---
podAntiAffinity:
  enabled: false        # un seul pod d'un meme service par noeud (kubernetes.io/hostname)

podDisruptionBudget:
  enabled: false
  minAvailable: 2

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# --- Pod Security Standards "restricted" (impose par P3) ---
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# --- Securite applicative (S3) ---
# Secret JWT partage par auth et transaction : Secret Kubernetes cree HORS depot (jamais dans Git) :
#   kubectl -n <namespace> create secret generic omnipay-jwt --from-literal=secret="$(openssl rand -base64 48)"
jwt:
  existingSecret: omnipay-jwt
  secretKey: secret

# Injection de panne pour la demo jury (bouton "Simuler Erreur 500", ROLE_ADMIN). Jamais en production.
chaos:
  enabled: false

# --- Portail web (Nginx non-root, port 8080) ---
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: harbor.omnipay.local:30002/omnipay/frontend-service
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Ingress NGINX du portail (active dans values-dev/recette/prod.yaml)
ingress:
  enabled: false
  className: nginx
  hosts:
    - app.omnipay.local
    - omnipay.local
  tls:
    enabled: true
    secretName: omnipay-frontend-tls
    clusterIssuer: omnipay-ca-issuer
  annotations: {}

services:
  auth:
    enabled: true
    image:
      repository: harbor.omnipay.local:30002/omnipay/auth-service
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8081
    jwt: true
    env: {}

  transaction:
    enabled: true
    image:
      repository: harbor.omnipay.local:30002/omnipay/transaction-service
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
    jwt: true
    chaos: true
    env: {}

  notification:
    enabled: true
    image:
      repository: harbor.omnipay.local:30002/omnipay/notification-service
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8083
    env: {}
