server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: transaction-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:omnipay;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true

omnipay:
  security:
    jwt:
      secret: ${OMNIPAY_JWT_SECRET:}
      issuer: omnipay-security-authority
  cors:
    allowed-origin-patterns: ${OMNIPAY_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  chaos:
    enabled: ${OMNIPAY_CHAOS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
