# Nginx non-root (nginxinc/nginx-unprivileged, UID 101, port 8080) : portail OmniPay + reverse-proxy des API.
# Compatible readOnlyRootFilesystem : pid et fichiers temporaires dans /tmp (emptyDir sur Kubernetes).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30s;
    client_max_body_size 64k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Adresses des microservices : docker-compose par defaut, remplacees par un ConfigMap sur Kubernetes.
    include /etc/nginx/upstreams.conf;

    # Anti brute-force sur l'authentification (par adresse IP).
    limit_req_zone $binary_remote_addr zone=auth_zone:1m rate=10r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # --- En-tetes de securite (aucun add_header dans les location : ils ecraseraient ceux-ci) ---
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # Aucun script, style ni police externe : tout est servi par le conteneur (mode hors-ligne pour la soutenance).
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # --- Reverse-proxy transparent ---
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Sonde de sante (Kubernetes / HEALTHCHECK Docker)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /api/auth/ {
            limit_req zone=auth_zone burst=30 nodelay;
            proxy_pass http://auth_backend;
        }

        location /api/transactions {
            proxy_pass http://transaction_backend;
        }

        location /api/ {
            return 404;
        }

        # Application monopage
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
