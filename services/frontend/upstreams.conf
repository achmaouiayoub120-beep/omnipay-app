# Adresses des microservices derriere le reverse-proxy (valeurs docker-compose).
# Sur Kubernetes, ce fichier est remplace par un ConfigMap genere par le chart Helm
# (noms de Services : <release>-auth, <release>-transaction).
upstream auth_backend {
    server auth-service:8081;
}

upstream transaction_backend {
    server transaction-service:8082;
}
